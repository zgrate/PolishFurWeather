services:
  eurofurence-weather:
    build:
      context: .
      args:
        BASE_IMAGE: ${EFW_BASE_IMAGE:-python:3.12-slim}
    image: eurofurence-weather:latest
    pull_policy: build
    container_name: eurofurence-weather
    restart: unless-stopped
    ports:
      - "8000:8000"
    mem_limit: 1g
    environment:
      # Required: this venue's IMGW SYNOP station and powiat TERYT code(s).
      # Left blank on purpose -- see app/config.py's IMGWSettings docstring
      # for where to look these up. The app starts without them but
      # observations/warnings stay unavailable until they are set.
      EFW_IMGW_STATION_ID: ""          # e.g. "12500" (Krakow-Balice)
      EFW_IMGW_STATION_NAME: ""        # e.g. "Krakow-Balice"
      EFW_IMGW_TERYT: ""               # comma-separated powiat TERYT code(s)
      EFW_LOCATION_NAME: ""            # venue city, shown in the UI
      EFW_FORECAST_HOURS: "120"
      EFW_BUSY_AT: "40"
      EFW_CROWDED_AT: "80"
      TZ: "Europe/Warsaw"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status == 200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
